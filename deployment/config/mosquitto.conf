# Kyron — Mosquitto broker config
# Drop this at /etc/mosquitto/conf.d/kyron.conf  OR
# pass it directly: mosquitto -c config/mosquitto.conf

# Listen on all interfaces so Raspberry Pi can reach it over Wi-Fi
listener 1883 0.0.0.0

# Allow unauthenticated connections (LAN demo only)
# For production: add password_file + certfile + keyfile
allow_anonymous true

# Log to stdout so you can watch handshake messages fly by
log_type all
log_dest stdout

# Retain messages (needed for MQTT handshake topics)
# persistence is optional for the demo
persistence false
